<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Mercado{% endblock %}</title>
    <!-- Bootstrap via CDN: dá um visual decente sem escrever CSS na mão -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'produto_list' %}">🛒 Mercado</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'produto_create' %}">
                + Novo produto
            </a>
        </div>
    </nav>

    <div class="container">

        {# Mensagens de sucesso (definidas com 'messages.success' nas views) #}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block conteudo %}
        {% endblock %}

    </div>

</body>
</html>
